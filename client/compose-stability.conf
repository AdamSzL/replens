// Types the Compose compiler cannot judge for itself, because the modules that
// own them are built without it. Listed here rather than annotated at the source
// so :core:* stays free of a Compose dependency — those modules are consumed by
// plain JUnit tests and the fixture generator, and should not know a UI exists.
//
// Named individually, not as com.replens.core.*: this file is an assertion the
// compiler cannot check, so a wildcard would silently vouch for every type added
// later, including one that turns out to be mutable. The failure mode is skipped
// recomposition, which looks like a rendering bug rather than a stability one.
//
// Only types a composable actually receives belong here — as a parameter, or as
// a field of one: CameraOptions reaches composables only inside WorkoutState, and
// leaving it out made the whole of WorkoutState unstable. PoseFrame is neither,
// and stays out: it reaches the Canvas inside a lambda, so its stability never
// comes up.
//
// Declaring a type stable also stops the compiler descending into its fields, so
// a field's own type needs no line. ZoomRange had one and never appeared in a
// stability report at all — CameraOptions above is what the compiler reads.
com.replens.core.exercise.SessionState
com.replens.core.pose.CameraOptions
com.replens.core.text.UiText
